<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/logo-bolao.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6EE" />
    <title>Cravada — bolão de palpites</title>
    <meta
      name="description"
      content="Bolão entre amigos: dê seu palpite de placar em cada jogo e dispute o ranking. Placar exato vale 5 pontos."
    />

    <!-- Open Graph: é isto que vira o card quando alguém manda o link no WhatsApp
         (ver o botão "Chamar a galera" em components/LembreteJogos.jsx). Sem isto o
         preview vinha só com a URL crua.

         ⚠️ og:url e og:image PRECISAM ser absolutas. WhatsApp e Facebook ignoram
         og:image relativa e o card sai sem imagem — é o erro clássico aqui. Mudou de
         domínio? Troque as três absolutas: canonical, og:url e og:image.

         A imagem é gerada, não desenhada à mão: a fonte é scripts/og-fonte.html e o
         comando de regerar está no fim daquele arquivo. -->
    <link rel="canonical" href="https://bolao.luccalandeiro.com.br/" />
    <meta property="og:site_name" content="Cravada" />
    <meta property="og:title" content="Cravada — bolão de palpites" />
    <meta
      property="og:description"
      content="Dê seu palpite de placar em cada jogo e dispute o ranking com a galera."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://bolao.luccalandeiro.com.br/" />
    <meta
      property="og:image"
      content="https://bolao.luccalandeiro.com.br/og-cravada.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Cravada — bolão de palpites, com o escudo do Brasileirão"
    />

    <!-- Twitter lê og:title/og:description sozinho; só o tipo de card precisa ser
         declarado pra a imagem aparecer grande em vez de miniatura. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Anton (display) + Hanken Grotesk (UI, pesos 400-900).
         900 é usado nos títulos/labels do Chaveamento (ver SPEC-chaveamento.md §2).
         Archivo entra só pro skin do Brasileirão (títulos/números da aba dele) —
         o corpo do app segue em Hanken Grotesk. Ver DESIGN.md §12. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
