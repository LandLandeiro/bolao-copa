<!doctype html>
<!--
  FONTE da imagem de compartilhamento (public/og-cravada.png), 1200x630.

  Fica em docs/ (que o Vite NÃO publica), e não em public/, pra não virar uma página
  pública solta no site. Editar aqui e rodar o comando do fim do arquivo regenera a
  imagem — melhor do que ter um PNG órfão que ninguém sabe como foi feito.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px;
        background: #0b5d2e;           /* verde campo (bra-campo) */
        display: flex; align-items: center; justify-content: center;
        font-family: 'Hanken Grotesk', system-ui, sans-serif;
        overflow: hidden; position: relative;
      }
      /* Raios concêntricos bem discretos — o motivo do DESIGN.md §5, só que
         quase imperceptível, pra não brigar com o texto. */
      .raios {
        position: absolute; inset: -20%;
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          rgba(255, 205, 0, 0.06) 0deg 6deg,
          transparent 6deg 12deg
        );
      }
      .conteudo {
        position: relative; display: flex; align-items: center; gap: 56px;
      }
      .logo { width: 200px; height: 200px; object-fit: contain; flex-shrink: 0; }
      .marca {
        font-family: 'Anton', sans-serif;
        font-size: 148px; line-height: 0.9; letter-spacing: -0.02em;
        color: #fff;
      }
      .linha {
        /* 48px/700: o card do WhatsApp mostra a imagem a ~1/3 do tamanho,
           então isto chega em ~16px na tela. Abaixo disso a linha some. */
        margin-top: 20px; font-size: 48px; font-weight: 700;
        color: #ffcd00;                /* amarelo SOBRE o verde escuro: 5.3:1, passa AA */
        letter-spacing: 0.01em;
      }
      /* Faixa amarela embaixo: assina a marca sem custar contraste. */
      .barra {
        position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
        background: #ffcd00;
      }
    </style>
  </head>
  <body>
    <div class="raios"></div>
    <div class="conteudo">
      <img class="logo" src="../public/brasileirao-logo.webp" alt="" />
      <div>
        <div class="marca">CRAVADA</div>
        <div class="linha">bolão de palpites</div>
      </div>
    </div>
    <div class="barra"></div>
  </body>
</html>
